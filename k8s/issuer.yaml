apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod-http01
  namespace: step
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@mail.opream.net
    privateKeySecretRef:
      name: letsencrypt-prod-http01-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
